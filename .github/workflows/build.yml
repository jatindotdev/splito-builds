# Builds Splito's Android app from the private jatindotdev/splito repo and
# publishes every build as a release here: `vX.Y.Z` tags as releases (with the
# Play Store AAB), main commits as pre-releases (`vX.Y.Z+N`, N commits past the
# last tag). jatindotdev/splito triggers it with a `build` repository_dispatch
# carrying the commit and its ref; it can also be run by hand.
name: Android build
run-name: Build ${{ github.event.client_payload.ref || inputs.ref }} @ ${{ github.event.client_payload.sha || inputs.sha }}

on:
  repository_dispatch:
    types: [build]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit of jatindotdev/splito to build
        required: true
      ref:
        description: "`main`, or the release tag (vX.Y.Z) the commit carries"
        required: true
        default: main

permissions:
  contents: read

# A newer main build replaces one still running; release builds always finish.
concurrency:
  group: ${{ startsWith(github.event.client_payload.ref || inputs.ref, 'v') && format('release-{0}', github.run_id) || 'main' }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  JAVA_VERSION: 17
  SOURCE_SHA: ${{ github.event.client_payload.sha || inputs.sha }}
  SOURCE_REF: ${{ github.event.client_payload.ref || inputs.ref }}

jobs:
  build:
    name: ${{ startsWith(github.event.client_payload.ref || inputs.ref, 'v') && 'Release' || 'Main build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      # The runner's free disk is tight for a React Native release build; these
      # toolchains are unused here.
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Check the request
        id: request
        working-directory: /
        run: |
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-character commit id"
            exit 1
          fi
          if [[ "$SOURCE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$SOURCE_REF" = "main" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::ref must be main or a vX.Y.Z tag"
            exit 1
          fi

      # Full history and tags: the version is worked out from the last vX.Y.Z tag.
      - name: Check out jatindotdev/splito
        uses: actions/checkout@v7
        with:
          repository: jatindotdev/splito
          ref: ${{ env.SOURCE_SHA }}
          ssh-key: ${{ secrets.SPLITO_DEPLOY_KEY }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install packages
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build @splito/shared
        run: pnpm --filter @splito/shared build
        working-directory: .

      - name: Work out the version
        id: version
        env:
          RELEASE: ${{ steps.request.outputs.release }}
        run: |
          app_version=$([ "$RELEASE" = "true" ] && echo "${SOURCE_REF#v}" || echo "")
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "version=$(APP_VERSION="$app_version" npx expo config --type public --json | jq -r .extra.displayVersion)" >> "$GITHUB_OUTPUT"

      - name: Generate the Android project
        run: npx expo prebuild --platform android --clean --no-install

      # ccache keeps compiled C++ (React Native, Expo and library native code)
      # between runs; Gradle's build cache can't reuse it.
      - name: Install ccache
        working-directory: /
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

      # One cache for Gradle's downloads and build cache plus ccache, keyed on
      # the lockfile and falling back to the newest. Not the rest of ~/.gradle:
      # its transforms are large and rebuilt quickly.
      - name: Restore build caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/build-cache-1
            ~/.cache/ccache
          key: android-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            android-${{ hashFiles('pnpm-lock.yaml') }}-
            android-

      - name: Load the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; refusing to publish a debug-signed build."
            exit 1
          fi
          store_file="$RUNNER_TEMP/upload.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$store_file"
          echo "store-file=$store_file" >> "$GITHUB_OUTPUT"

      - name: Gradle build
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
          ORG_GRADLE_PROJECT_SPLITO_UPLOAD_STORE_FILE: ${{ steps.signing.outputs.store-file }}
          ORG_GRADLE_PROJECT_SPLITO_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_SPLITO_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_SPLITO_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Every CMake project compiles through ccache, not only those that
          # look for it. Checkout and prebuild give files new timestamps, so
          # ccache goes by content.
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros,pch_defines
          CCACHE_MAXSIZE: 1G
        # arm64-v8a only: every phone in use, a quarter of the native compiling,
        # and a much smaller APK. The AAB is only for releases (the Play Store).
        run: ./gradlew assembleRelease ${{ steps.request.outputs.release == 'true' && 'bundleRelease' || '' }} -PreactNativeArchitectures=arm64-v8a --build-cache

      - name: Save build caches
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/build-cache-1
            ~/.cache/ccache
          key: android-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}

      - name: Package and summarize
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="splito-$VERSION"
          mkdir -p "$RUNNER_TEMP/out"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/$name.apk"
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/$name.aab"
          fi

          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          {
            echo "### $name"
            echo '```'
            ccache --show-stats | head -n 12
            echo '```'
            echo '```'
            "$apksigner" verify --print-certs "$RUNNER_TEMP/out/$name.apk"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The release's tag is created on this repo's main; the notes say which
      # source commit it came from. A rebuild of the same version replaces its
      # files.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE: ${{ steps.request.outputs.release }}
        run: |
          tag="v$VERSION"
          notes="Built from jatindotdev/splito@${SOURCE_SHA:0:7} ($SOURCE_REF)."
          if [ "$RELEASE" = "true" ]; then
            kind=(--latest)
          else
            kind=(--prerelease --latest=false)
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP"/out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$RUNNER_TEMP"/out/* --repo "$GITHUB_REPOSITORY" \
              --target main --title "Splito $VERSION" --notes "$notes" "${kind[@]}"
          fi
          echo "Released at $(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
